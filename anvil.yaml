"QC", "addressCountry": "CA"}}]}</script>
    <noscript><div class="seo-noscript">
    <h1>City Fun Time: a life-sim game on your real streets in 3D</h1>
    <p>Your real neighbourhood, rebuilt in 3D from the map. Run errands, make friends, fall in love, open businesses and take over the blocks. 150+ missions at real places.</p>
    <p>City Fun Time is a life-simulation game on your real streets. Type your address and the neighbourhood around it is rebuilt in 3D from OpenStreetMap: real buildings, streets, parks, hills, house numbers and shop names, filled with people walking dogs, traffic and pigeons.</p>
    <p>You arrive with $20 and a backpack, crash on Cousin Max&#x27;s couch and work your way up: errands, odd jobs, a lemonade stand, friends, love, a wedding, kids, fifteen businesses, a penthouse and every block won back from the crews. 165 missions, played at real places near you. After dark, cartoon monsters come out and you bonk them with a baguette.</p>
    <p>Who it's for: Players who want a life-sim adventure set in their own neighbourhood</p>
    <h2>What it does</h2><ul><li>Any address rebuilt in 3D from OpenStreetMap, with real hills from Mapterhorn elevation data</li><li>Traffic lights, shop signs on every place, street lamps, parked cars, busy pavements</li><li>165 missions: 85 story missions in 9 chapters, plus side stories and odd jobs</li><li>Friends, love, a family and fifteen businesses</li><li>Street life: cartoon monsters at night, silly weapons, flirting, street folk to help, pranks on made-up shops, random street events</li><li>An album of 84 stickers and photo missions</li><li>Leaderboards for net worth, level, blocks and missions</li><li>Play as a guest; saves stay in the browser</li></ul>
    <h2>Questions</h2><h3>Is the city really my neighbourhood?</h3><p>Yes. Type an address (or use where you are) and the streets, buildings, parks and shop names around it come from OpenStreetMap. The hills are real too, from Mapterhorn&#x27;s open elevation data.</p><h3>Do I need an account?</h3><p>No. Guests play and save in the browser; an account keeps your progress.</p><h3>How long is the game?</h3><p>There are 165 missions: 85 story missions in nine chapters plus side missions.</p>
    <p><a href="https://city-fun-time.anvil.app/about">About City Fun Time</a> &middot; <a href="https://city-fun-time.anvil.app/llms.txt">City Fun Time for AI assistants</a> &middot; Made by <a href="https://arkvital.com">Arkvital</a>, Montreal, Canada. City Fun Time needs JavaScript in your browser.</p>
    </div></noscript>
    <!-- seo:end -->
