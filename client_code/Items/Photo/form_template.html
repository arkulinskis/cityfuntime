<div class="al-photo-host">
  <figure class="al-photo">
    <img anvil:dom-node="img" alt="" loading="lazy">
    <anvil-component type="Label" name="caption" prop:role='["al-photo-cap"]' bind:text="self.item['caption']"></anvil-component>
    <anvil-component type="Label" name="meta" prop:role='["al-photo-meta"]' bind:text="self.item['meta']"></anvil-component>
  </figure>
</div>
